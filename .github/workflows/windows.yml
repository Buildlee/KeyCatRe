name: Windows

# Builds the Tauri shell in win/ on a real Windows runner. KeyCat is updated by hand from the
# release page: win/ has no updater plugin and the bundle is not signed, so nothing here signs
# artefacts or writes latest.json / latest.yml either. Those two manifests are what the 1.0.x
# Electron build polled, and not publishing them is what keeps it from updating itself.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: win/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: win

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match win/package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # No TAURI_SIGNING_*: without the updater plugin and without createUpdaterArtifacts there is
      # nothing to sign, so a pull request, a push to main and a tag all run the same command.
      - name: Build installer
        run: npm run dist

      # The updater is gone, so a signature or a manifest in the bundle means a dependency came back.
      - name: Check that nothing updater-shaped was built
        run: |
          found="$(ls target/release/bundle/nsis/*.sig target/release/bundle/nsis/latest* 2>/dev/null || true)"
          if [ -n "$found" ]; then
            echo "unexpected updater artefacts in the bundle:" >&2
            echo "$found" >&2
            exit 1
          fi

      - name: Collect release files
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p out
          cp target/release/bundle/nsis/KeyCat_"$version"_x64-setup.exe out/KeyCat-Windows-Setup.exe
          ls -l out

      # One asset, no manifests: the release page is the whole update story for KeyCat.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/KeyCat-Windows-Setup.exe --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: keycat-windows
          path: win/out/*
          if-no-files-found: error
